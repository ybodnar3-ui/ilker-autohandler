name: Sync & Deploy

# Скрейпить сток willhaben і публікує сайт на GitHub Pages.
# - за розкладом кожні 30 хв (парсер 24/7),
# - при пуші змін сайту чи парсера,
# - вручну (кнопка Run workflow).
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'sync/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# GITHUB_TOKEN: писати оновлений каталог у репо + деплой Pages.
permissions:
  contents: write
  pages: write
  id-token: write

# Один деплой за раз; цикли, що набігли, не скасовуємо на півдорозі.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sync/package-lock.json

      - name: Install pipeline deps
        working-directory: sync
        run: npm ci

      - name: Scrape willhaben → catalog.json + data.js
        working-directory: sync
        env:
          DATA_DIR: ../web/data
          WILLHABEN_ORG_ID: '1004471'
          USER_AGENT: 'HayatGruppeSync/1.0 (+https://hayatgruppe.com)'
        run: npm run sync:fs

      # Комітимо оновлений стан, щоб наступний цикл мав з чим порівнювати
      # (перевірка осудності захищає від публікації підозріло малого стоку).
      # Коміт лише коли є реальні зміни — без порожніх комітів щопівгодини.
      - name: Commit updated stock
        run: |
          git config user.name 'hayat-sync[bot]'
          git config user.email 'hayat-sync@users.noreply.github.com'
          git add web/data web/data.js
          if git diff --cached --quiet; then
            echo 'Сток без змін — коміт не потрібен.'
          else
            git commit -m 'chore(sync): update stock from willhaben [skip ci]'
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
