name: Sync stock

# Парсер 24/7: скрейпить сток willhaben, обирає чисті обкладинки (без рекламних
# банерів дилера), будує web/data.js і комітить у репо. Хостинг — Vercel:
# він передеплоює сайт автоматично на кожен коміт (Git integration).
# - за розкладом кожні 30 хв,
# - при пуші змін сайту чи парсера,
# - вручну (Run workflow).
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'sync/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Лише коміт оновленого стоку; деплой робить Vercel.
permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sync/package-lock.json

      - name: Install pipeline deps
        working-directory: sync
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cover-picker deps
        run: pip install pillow numpy

      - name: Scrape willhaben → catalog.json
        working-directory: sync
        env:
          DATA_DIR: ../web/data
          WILLHABEN_ORG_ID: '1004471'
          USER_AGENT: 'HayatGruppeSync/1.0 (+https://hayatgruppe.com)'
        run: npm run sync:fs

      - name: Pick clean covers (skip promo banners)
        env:
          DATA_DIR: web/data
          USER_AGENT: 'HayatGruppeSync/1.0 (+https://hayatgruppe.com)'
        run: python3 sync/scripts/pick-covers.py

      - name: Build web/data.js
        working-directory: sync
        env:
          DATA_DIR: ../web/data
        run: npm run build:data

      # Коміт лише коли є реальні зміни — без порожніх комітів щопівгодини.
      # covers.json теж комітимо: це кеш вибору обкладинок (за підписом фото),
      # щоб наступний цикл не перекачував весь сток.
      # Коміт лише коли реально змінився вміст сайту (data.js) або вибір
      # обкладинок (covers.json). catalog/live/status містять таймстемпи, що
      # змінюються щоцикл, тож на них НЕ орієнтуємось — інакше коміт (і зайвий
      # редеплой Vercel) щопівгодини навіть без змін стоку.
      - name: Commit updated stock
        run: |
          git config user.name 'hayat-sync[bot]'
          git config user.email 'hayat-sync@users.noreply.github.com'
          git add web/data web/data.js
          if git diff --cached --quiet -- web/data.js web/data/covers.json; then
            echo 'Сток без змістовних змін — коміт не потрібен.'
          else
            git commit -m 'chore(sync): update stock from willhaben [skip ci]'
            git push
          fi
